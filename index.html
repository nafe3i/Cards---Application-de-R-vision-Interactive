<!DOCTYPE html>
<html lang="fr" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cards</title>
    <link href="src/output.css" rel="stylesheet" />
  </head>
  <body
    class="min-h-screen flex flex-col justify-between box-border bg-amber-50 dark:bg-[#101622] text-[#101622] dark:text-gray-200 transition-colors duration-500"
    id="pageBody"
  >
    <!-- Header -->
    <header
      class="w-[90vw] mx-auto relative flex flex-wrap items-center justify-between px-4 py-4 border-b border-[#5D75EB] md:px-8"
    >
      <!-- Logo -->
      <div class="flex items-center gap-2">
        <a href="index.html" class="flex items-center gap-2">
          <img src="imgs/logo.png" alt="logo" class="h-8 md:h-10" />
          <img src="imgs/logoblack.png" alt="dark" class="hidden dark h-8 md:h-10" />
          <span class="font-bold text-lg md:text-xl text-[#5D75EB]">Cards</span>
        </a>
      </div>

      <!-- Burger button (visible only on mobile) -->
      <button id="burger" class="md:hidden flex flex-col gap-1 z-50">
        <span class="w-6 h-0.5 bg-[#5D75EB]"></span>
        <span class="w-6 h-0.5 bg-[#5D75EB]"></span>
        <span class="w-6 h-0.5 bg-[#5D75EB]"></span>
      </button>

      <!-- Desktop Navbar -->
      <nav
        class="hidden md:flex justify-between items-center w-full md:w-[50vw]"
        id="navDesktop"
      >
        <ul class="flex flex-wrap gap-4 md:gap-6 text-lg">
          <li><a href="FlashCards.html" class="hover:text-[#5D75EB]">Flashcards</a></li>
          <li><a href="quiz.html" class="hover:text-[#5D75EB]">Quiz</a></li>
        </ul>
        <button
          id="mode"
          class="w-10 h-4 rounded-full border border-gray-400 flex items-center bg-black"
        >
          <span class="w-3 h-3 bg-gray-900 rounded-full ml-1 dark:bg-amber-100"></span>
        </button>
      </nav>

      <!-- Mobile Sidebar -->
      <nav
        id="navMobile"
        class="absolute top-full right-0 w-2/3 sm:w-1/3 transform hidden z-40 bg-white dark:bg-[#101622] shadow-lg"
      >
        <div class="flex flex-col gap-4 p-6 text-lg">
          <a href="FlashCards.html" class="hover:text-[#5D75EB]">Flashcards</a>
          <a href="quiz.html" class="hover:text-[#5D75EB]">Quiz</a>
          <button
            id="modeMobile"
            class="w-10 h-4 rounded-full bg-amber-50 border border-gray-400 flex items-center dark:bg-black"
          >
            <span class="w-3 h-3 bg-gray-900 rounded-full ml-1 dark:bg-amber-100"></span>
          </button>
        </div>
      </nav>
    </header>

    <!-- Main -->
    <main class="flex flex-col items-center mt-8 md:mt-10 px-4">
      <h1 class="font-black text-2xl md:text-5xl mb-2 text-center">Cards</h1>
      <p class="mb-6 md:mb-8 text-center text-base md:text-lg text-[#101622] dark:text-gray-400 max-w-full md:max-w-[70vw]">
        Votre outil simple pour créer, mémoriser et réviser vos connaissances.
      </p>

      <div class="flex flex-col md:flex-row md:justify-center gap-3 md:gap-6 w-full md:w-10/12 mb-6">
        <a
          href="FlashCards.html"
          class="flex items-center justify-center flex-wrap gap-2 px-5 py-3 bg-blue-600 text-white rounded-lg font-semibold shadow hover:bg-blue-700 transition text-center"
        >
          <img src="imgs/flashcards.png" alt="" class="h-6 md:h-8" />
          Accéder à mes Flashcards
        </a>
        <a
          href="quiz.html"
          class="flex items-center justify-center flex-wrap gap-2 px-5 py-3 bg-green-600 text-white rounded-lg font-semibold shadow hover:bg-green-700 transition text-center"
        >
          <img src="imgs/quiz.png" alt="" class="h-6 md:h-8" />
          Commencer un Quiz
        </a>
      </div>

      <div
        class="bg-[#E5E5E5] dark:bg-slate-800 px-6 md:px-10 py-6 rounded-xl border border-blue-300 flex flex-col items-center hover:shadow hover:shadow-amber-50 w-full md:w-4/12"
      >
        <p class="dark:text-gray-400 font-semibold">Collections Disponibles</p>
        <p
          id="nbr"
          class="text-3xl md:text-4xl font-bold text-gray-950 dark:text-blue-300 mt-2"
        ></p>
      </div>
    </main>

    <!-- Footer -->
    <footer class="w-[90vw] mx-auto text-center p-3 border-t border-blue-400 dark:text-gray-400">
      2025 Cards
    </footer>

    <script src="js/menu.js"></script>
    <script>
      const collections = JSON.parse(localStorage.getItem("collections_local")) || [];
      const nbr = document.getElementById("nbr");
      nbr.value = collections.length;
      nbr.textContent = collections.length;
    </script>
  </body>
</html>
