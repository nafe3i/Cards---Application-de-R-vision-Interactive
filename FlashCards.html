<!DOCTYPE html>
<html lang="fr" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cards</title>
    <link href="src/output.css" rel="stylesheet" />
    <style>
      .card {
        perspective: 1000px;
      }
      .card-inner {
        position: relative;
        width: 100%;
        height: 220px;
        transform-style: preserve-3d;
        transition: transform 0.6s;
      }
      .card.flipped .card-inner {
        transform: rotateY(180deg);
      }
      .card-front,
      .card-back {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        border-radius: 1rem;
        padding: 1.5rem;
      }
      .card-front {
        background-color: #1f2937; /* gris foncé */
        color: white;
      }
      .card-back {
        background-color: #253fff; /* bleu */
        color: white;
        transform: rotateY(180deg);
      }
    </style>
  </head>
  <body
    class="min-h-screen flex flex-col justify-between box-border bg-amber-50 dark:bg-[#101622] text-[#101622] dark:text-gray-200 transition-colors duration-500"
    id="pageBody"
  >
    <!-- Header -->
    <header
      class="w-[90vw] mx-auto relative flex flex-wrap items-center justify-between px-4 py-4 border-b border-[#5D75EB] md:px-8"
    >
      <!-- Logo -->
      <div class="flex items-center gap-2">
        <a href="index.html" class="flex items-center gap-2">
          <img src="imgs/logo.png" alt="logo" class="h-8 md:h-10" />
          <img
            src="imgs/logoblack.png"
            alt="dark"
            class="hidden dark h-8 md:h-10"
          />
          <span class="font-bold text-lg md:text-xl text-[#5D75EB]">Cards</span>
        </a>
      </div>

      <!-- Burger button (visible only on mobile) -->
      <button id="burger" class="md:hidden flex flex-col gap-1 z-50">
        <span class="w-6 h-0.5 bg-[#5D75EB]"></span>
        <span class="w-6 h-0.5 bg-[#5D75EB]"></span>
        <span class="w-6 h-0.5 bg-[#5D75EB]"></span>
      </button>

      <!-- Desktop Navbar -->
      <nav
        class="hidden md:flex justify-between items-center w-full md:w-[50vw]"
        id="navDesktop"
      >
        <ul class="flex flex-wrap gap-4 md:gap-6 text-lg">
          <li>
            <a href="FlashCards.html" class="hover:text-[#5D75EB]"
              >Flashcards</a
            >
          </li>
          <li><a href="quiz.html" class="hover:text-[#5D75EB]">Quiz</a></li>
        </ul>
        <button
          id="mode"
          class="w-10 h-4 rounded-full border border-gray-400 flex items-center bg-black"
        >
          <span
            class="w-3 h-3 bg-gray-900 rounded-full ml-1 dark:bg-amber-100"
          ></span>
        </button>
      </nav>

      <!-- Mobile Sidebar -->
      <nav
        id="navMobile"
        class="absolute top-full right-0 w-2/3 sm:w-1/3 transform hidden z-40 bg-white dark:bg-[#101622] shadow-lg"
      >
        <div class="flex flex-col gap-4 p-6 text-lg">
          <a href="FlashCards.html" class="hover:text-[#5D75EB]">Flashcards</a>
          <a href="quiz.html" class="hover:text-[#5D75EB]">Quiz</a>
          <button
            id="modeMobile"
            class="w-10 h-4 rounded-full bg-amber-50 border border-gray-400 flex items-center dark:bg-black"
          >
            <span
              class="w-3 h-3 bg-gray-900 rounded-full ml-1 dark:bg-amber-100"
            ></span>
          </button>
        </div>
      </nav>
    </header>

    <main class="w-full md:w-[90vw] mx-auto mt-4 px-4 md:px-0">
      <div
        id="herosection"
        class="flex flex-col md:flex-row md:items-center gap-3 md:gap-5 mb-9"
      >
        <h1 class="font-black text-2xl md:text-5xl text-center md:text-left">
          Gérez vos Flashcards
        </h1>
        <p
          class="text-center md:text-left text-base md:text-lg text-gray-700 dark:text-gray-300"
        >
          Créez de nouvelles collections et ajoutez des cartes pour commencer à
          étudier.
        </p>
      </div>

      <section
        id="section"
        class="flex flex-col w-full md:w-[75vw] mx-auto gap-5"
      >
        <!-- Créer du contenu -->
        <div
          id="contenu"
          class="bg-[#1F2937] border border-gray-600 text-amber-50 p-4 rounded-xl w-full md:w-[80%] mx-auto"
        >
          <h3 class="font-bold text-xl md:text-2xl mb-2">Créer du Contenu</h3>
          <div
            class="bg-[#1F2937] m-2 md:m-5 mx-auto rounded-md border p-3.5 w-full md:w-[80%]"
          >
            <h3
              class="text-center text-amber-50 font-bold mb-1.5 text-lg md:text-xl"
            >
              Créer une nouvelle collection
            </h3>
            <p class="text-center text-gray-300 mb-1">Titre de la collection</p>
            <input
              type="text"
              id="collection"
              placeholder="ex: HTML"
              class="border border-black rounded-md p-1 bg-none text-center w-full"
            />
            <button
              id="getcoll"
              type="submit"
              class="block bg-[#3B82F6] w-full md:w-[50%] mx-auto mt-4 border border-black rounded-md p-2 hover:bg-blue-900 transition"
            >
              Créer la collection
            </button>
          </div>
        </div>

        <!-- Ajouter une carte -->
        <div
          id="carte"
          class="bg-[#1F2937] border border-gray-600 text-amber-50 p-4 rounded-xl w-full md:w-[80%] mx-auto"
        >
          <h3 class="font-bold text-lg md:text-xl mb-3">
            Ajouter une nouvelle carte
          </h3>

          <div class="mb-2">
            <label for="infocol" class="mb-1 text-sm md:text-base text-gray-300"
              >Titre de la collection</label
            >
            <select
              name="titre"
              id="infocol"
              class="w-full md:w-[90%] mx-auto text-center p-2 rounded-md bg-gray-800 border border-gray-500 focus:border-blue-400"
            ></select>
          </div>

          <div class="mb-2">
            <label
              for="question"
              class="mb-1 text-sm md:text-base text-gray-300"
              >Question</label
            >
            <input
              type="text"
              id="question"
              placeholder="Écrivez la question"
              class="w-full md:w-[90%] mx-auto text-center p-2 rounded-md bg-gray-800 border border-gray-500 focus:border-blue-400"
            />
          </div>

          <div class="mb-4">
            <label for="reponse" class="text-sm md:text-base text-gray-300"
              >Réponse</label
            >
            <input
              type="text"
              id="reponse"
              placeholder="Écrivez la réponse"
              class="w-full md:w-[90%] mx-auto text-center p-2 rounded-md bg-gray-800 border border-gray-500 focus:border-blue-400"
            />
          </div>

          <button
            type="submit"
            id="inforep"
            class="block w-full md:w-[50%] mx-auto py-2 bg-[#223B63] hover:bg-[#1e3a8a] text-[#6272FF] hover:text-amber-50 font-semibold rounded-lg transition duration-300"
          >
            + Ajouter la carte
          </button>
          <div id="ecrire" class="mt-3"></div>
        </div>

        <!-- Affichage des collections -->
        <div
          id="affichage"
          class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3 m-2 md:m-4 text-amber-50"
        ></div>
        <div
          id="affichage_cards"
          class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3 m-2 md:m-4 text-amber-50"
        ></div>
      </section>
    </main>
    <footer
      class="w-[90vw] mx-auto text-center p-3 border-t border-blue-400 dark:text-gray-400"
    >
      2025 Cards
    </footer>
  </body>
  <script src="js/menu.js"></script>
  <script src="js/flashcard.js"></script>
</html>
